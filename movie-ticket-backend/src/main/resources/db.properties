# 数据库连接配置
# 优先级：环境变量（DB_URL / DB_USER / DB_PASSWORD） > 本文件 > 代码内置默认值
#
# 换到别的机器时，把 db.password 改成那台机器的 root 密码即可。
db.password=你的密码

db.user=root
db.url=jdbc:mysql://localhost:3306/movie_ticket?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
